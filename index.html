<!DOCTYPE html>
<html>
    <head>
        <title>palindrome recognizer</title>
       <style>
       body{
    text-align: center;
}
div{
    background-color: blue;
    width: 400px;
    margin: 30px auto;
    padding: 10px;
    border-radius: 10px;
    color: white;
}
button{
    background-color: greenyellow;
    color: white;
    padding: 5px 10px;
    border: none;
    border-radius: 10px;
}
label{
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}
input{
    margin-bottom: 20px;
    width: 90%;
    box-sizing: border-box;
    padding: 5px 10px;
    border-radius: 10px;
}
p{
    color: green;
    font-size: 20px;
}
    </style>
    </head>
    <body>
        <h1>palindrome recognizer</h1>
        <div>
            <label>enter the word</label>
            <input type="text" id="textInput">
            <button onclick="checkPalindrome()">Check palindrome</button>
        </div>
        <p id="result"></p>
        <script>
            function checkPalindrome(){
                let text = document.getElementById("textInput").value;
                let textValue = text.split("").reverse().join("")    

                if(text==textValue){
                    document.getElementById("result").innerHTML = "this is a palindrome";
                }
                else{
                    document.getElementById("result").innerHTML = "this is not a palindrome";
                }
            }
        </script>
    </body>
</html>
